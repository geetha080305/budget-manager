services:
  # 1. MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: expense-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: expense_db
      MYSQL_USER: expense_user
      MYSQL_PASSWORD: expense_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # 2. Spring Boot Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: expense-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: expense_db
      DB_USERNAME: expense_user
      DB_PASSWORD: expense_pass
      JWT_SECRET: c2VjdXJlLWp3dC1zZWNyZXQta2V5LTI1Ni1iaXQtdmFsaWQtZm9yLWV4cGVuc2UtbWFuYWdlcg==
      JWT_EXPIRATION_MS: 86400000
    ports:
      - "8080:8080"

  # 3. Static Web Frontend (Nginx Reverse Proxy)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: expense-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "5500:80"

volumes:
  mysql_data:
    driver: local
