<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Expense Manager</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center;">
    <div class="container">
        <div class="auth-container">
            <h2 id="formTitle">Login</h2>
            
            <!-- Login Form -->
            <div id="loginForm">
                <div class="form-group">
                    <label for="loginUsername">Username</label>
                    <input type="text" id="loginUsername" placeholder="Enter your username">
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password">
                </div>
                <button class="btn btn-primary" onclick="handleLogin()">Login</button>
                <div class="auth-toggle">
                    Don't have an account? <a onclick="toggleForm()">Sign up</a>
                </div>
            </div>

            <!-- Register Form -->
            <div id="registerForm" style="display: none;">
                <div class="form-group">
                    <label for="regUsername">Username</label>
                    <input type="text" id="regUsername" placeholder="Choose a username">
                </div>
                <div class="form-group">
                    <label for="regEmail">Email</label>
                    <input type="email" id="regEmail" placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label for="regFullName">Full Name</label>
                    <input type="text" id="regFullName" placeholder="Enter your full name">
                </div>
                <div class="form-group">
                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword" placeholder="Choose a password (min 8 chars)">
                </div>
                <button class="btn btn-success" onclick="handleRegister()">Sign Up</button>
                <div class="auth-toggle">
                    Already have an account? <a onclick="toggleForm()">Login</a>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        if (AuthService.isLoggedIn()) {
            window.location.href = 'dashboard.html';
        }

        function toggleForm() {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const formTitle = document.getElementById('formTitle');
            
            loginForm.style.display = loginForm.style.display === 'none' ? 'block' : 'none';
            registerForm.style.display = registerForm.style.display === 'none' ? 'block' : 'none';
            formTitle.textContent = registerForm.style.display === 'none' ? 'Login' : 'Sign Up';
        }

        async function handleLogin() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            if (!username || !password) {
                showAlert('Username and password are required', 'warning');
                return;
            }

            try {
                const response = await ApiClient.login(username, password);
                AuthService.setToken(response.token);
                AuthService.setUsername(response.username);
                window.location.href = 'dashboard.html';
            } catch (error) {
                showAlert('Login failed: ' + error.message, 'danger');
            }
        }

        async function handleRegister() {
            const username = document.getElementById('regUsername').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const fullName = document.getElementById('regFullName').value.trim();
            const password = document.getElementById('regPassword').value.trim();

            if (!username || !email || !password) {
                showAlert('All fields are required', 'warning');
                return;
            }

            if (password.length < 8) {
                showAlert('Password must be at least 8 characters', 'warning');
                return;
            }

            try {
                const response = await ApiClient.register(username, email, password, fullName);
                AuthService.setToken(response.token);
                AuthService.setUsername(response.username);
                window.location.href = 'dashboard.html';
            } catch (error) {
                showAlert('Registration failed: ' + error.message, 'danger');
            }
        }

        // Allow Enter key to submit
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                if (document.getElementById('loginForm').style.display !== 'none') {
                    handleLogin();
                } else {
                    handleRegister();
                }
            }
        });
    </script>
</body>
</html>
