# ===== Server =====
server.port=${SERVER_PORT:8080}

# ===== Database (MySQL) =====
# Local dev default: run MySQL via Docker, e.g.
#   docker run --name expense-mysql -e MYSQL_ROOT_PASSWORD=root -e MYSQL_DATABASE=expense_db -p 3306:3306 -d mysql:8.0
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:expense_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# update = auto-creates/updates tables from entities during development.
# Switch to "validate" once the schema is stable, and manage migrations properly (e.g. Flyway) beyond the student-project stage.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== JWT =====
# NEVER commit a real secret. Set JWT_SECRET as an environment variable.
# This default is only a local-dev fallback (32+ chars required for HS256).
jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-before-any-real-use-32chars}
# Access token validity in milliseconds (default: 60 minutes)
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# ===== Logging =====
logging.level.org.springframework.security=INFO

# ===== Actuator =====
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
