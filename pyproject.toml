[project]
name = "budget-manager-e2e-tests"
version = "1.0.0"
description = "Functional and End-to-End Test Automation Suite for Budget Manager"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.0.0",
    "httpx>=0.28.0",
    "playwright>=1.49.0",
    "pytest-playwright>=0.6.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"

